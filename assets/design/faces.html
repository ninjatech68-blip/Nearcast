<!doctype html>
<html>
<head><meta charset="utf-8" /><style>html,body{margin:0}#s{width:256px;height:256px}</style></head>
<body>
<div id="s"></div>
<script>
/*
 * fixture portrait placeholders. production photos are camera-verified
 * selfies; fixtures never fabricate a human face, so these are the
 * app's own head-and-shoulders mark on each person's field color.
 * regenerate: chromium --headless --window-size=256,256 --screenshot=out.png 'file://...?n=aarav'
 */
const P = {
  aarav:  { bg: '#FF4D00', fg: '#14120E' },
  meera:  { bg: '#FFC633', fg: '#14120E' },
  dev:    { bg: '#17442E', fg: '#F4EFE4' },
  riya:   { bg: '#14120E', fg: '#FF4D00' },
  arjun:  { bg: '#F4EFE4', fg: '#14120E' },
  me:     { bg: '#FF4D00', fg: '#F4EFE4' },
};
const n = new URLSearchParams(location.search).get('n') || 'me';
const { bg, fg } = P[n];
document.getElementById('s').innerHTML = `
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" fill="${bg}"/>
  <circle cx="128" cy="102" r="52" fill="${fg}"/>
  <path d="M 40 256 A 88 88 0 0 1 216 256 Z" fill="${fg}"/>
</svg>`;
</script>
</body>
</html>
