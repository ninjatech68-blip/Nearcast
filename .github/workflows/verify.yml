name: Verify

on:
  pull_request:
  push:
    branches: [main, 'claude/**', 'codex/**']

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          EXPO_PUBLIC_APP_ENV: local
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Bundle for web (device-free preview surface)
        # Proves the app's JS graph is bootable without a native device — a
        # failure here surfaces a native-only import that would only otherwise
        # be caught on a real phone. Success is not a claim about UI parity
        # with iOS; native components can render different or missing on web.
        run: npm run bundle:web
        env:
          EXPO_PUBLIC_APP_ENV: local
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Serve delete-account
        # Runs in the background for the acceptance script. Kept alive by CI
        # until the job ends; the pid file lets the always-cleanup step stop
        # it without needing to know its shell state.
        run: |
          nohup npx supabase functions serve delete-account > /tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/delete-account -H 'Content-Type: application/json' -d '{}' || true)
            # 401 (unauth) or 405 (method) both mean the function is serving.
            if [ "$code" = "401" ] || [ "$code" = "400" ] || [ "$code" = "405" ]; then
              echo "delete-account is up (HTTP $code)"; exit 0
            fi
            sleep 1
          done
          echo "delete-account did not come up in 60s; log follows:"; tail -80 /tmp/serve.log; exit 1
      - name: Verify delete-account end to end
        run: bash scripts/verify-delete-account.sh
      - name: Stop the delete-account server
        if: always()
        run: |
          if [ -f /tmp/serve.pid ]; then kill "$(cat /tmp/serve.pid)" 2>/dev/null || true; fi
      - name: Database lint
        run: npx supabase db lint --level warning --schema public,private
      - name: Generated types must match the schema
        # database.types.ts was hand-extended in an environment that could not
        # run the generator. This gate regenerates it on the real stack and
        # fails on any drift, with the diff as the fix.
        run: |
          npm run db:types
          git diff --exit-code -- src/infrastructure/supabase/database.types.ts
