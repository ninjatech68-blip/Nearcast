name: Verify

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: neither job writes to the repository.
permissions:
  contents: read

# The database job binds fixed host ports (54321-54324) via `supabase start`,
# so two runs on the same ref race for them. Superseded PR runs are cancelled;
# runs on main are allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          EXPO_PUBLIC_APP_ENV: local
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
